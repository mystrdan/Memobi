[package]
name = "memobi-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "memobi_core"
path = "src/lib.rs"

[dependencies]
sha2 = "0.10"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand_core = { version = "0.6", features = ["getrandom"] }
zeroize = "1"
subtle = "2"

[dev-dependencies]
memobi-poarm = { path = "../poarm" }

